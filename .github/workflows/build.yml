
name: HarmonyOS HAP Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          set -eu
          test -f build-profile.json5
          test -f hvigorfile.ts
          test -f oh-package.json5
          test -f entry/src/main/module.json5
          echo "HarmonyOS project files found."

      - name: Check build environment
        run: |
          echo "Node version:"
          node --version
          echo "Checking for HarmonyOS SDK..."
          if [ -n "${DEVECO_SDK_HOME:-}" ] &&
             [ -d "$DEVECO_SDK_HOME" ]; then
            echo "HarmonyOS SDK directory found."
          else
            echo "::error::HarmonyOS SDK is not installed. A compatible DevEco SDK and Hvigor toolchain are required to build a HAP."
            exit 1
          fi
